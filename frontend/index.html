<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a3a2e" />
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('cookbook-theme'); } catch {}
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
        ? saved : 'dark';
    })();
  </script>
  <title>CookBook AI — рецепти з того, що є вдома</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
